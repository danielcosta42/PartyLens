name: Lint

# Blocking checks on every push and pull request: luacheck (undefined globals included, see .luacheckrc), every
# harness in tools/ and the ChehulNet lock. The author cannot always run the addon in game, so this is the net.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Clone do projeto
        uses: actions/checkout@v4

      - name: Install Lua 5.1, LuaRocks and LuaJIT
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1 luarocks luajit > /dev/null

      - name: Install luacheck
        run: sudo luarocks install luacheck > /dev/null

      - name: luacheck
        run: luacheck Modules Core.lua UI

      - name: Textures
        # Media/*.tga come from tools/gen-media.py (standard library only); a hand-edited or stale texture fails.
        run: python3 -I tools/gen-media.py --check

      - name: Harnesses
        # Every tools/*.lua runs the real addon files under a simulated Forever client and exits 1 on the first
        # failed check. Files named *stub.lua are the simulated clients themselves (libraries), not harnesses.
        run: |
          for f in tools/*.lua; do
            case "$f" in *stub.lua) continue ;; esac
            luajit "$f" || { echo "$f failed" >&2; exit 1; }
          done

      - name: ChehulNet copies
        # Libs/LibChehulMesh.lua and Modules/ChehulNet.lua come from danielcosta42/chehulnet through its
        # tools/sync.sh; a copy edited here would be lost at the next sync.
        run: bash tools/chehulnet-lock.sh
